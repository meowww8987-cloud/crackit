<?xml version="1.0" encoding="utf-8"?>
<!-- NEET 2027 PWA icon (192x192, maskable-safe)
     Maskable safe zone = inner 80% (153x153 centered). All key elements
     must fit inside this zone to look correct on Android adaptive icons.
     Full-bleed dark background, large atom + medical cross in center. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b15"/>
      <stop offset="100%" stop-color="#131623"/>
    </linearGradient>
    <radialGradient id="nucleus-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#14b8a6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="192" height="192" fill="url(#bg-grad)"/>

  <!-- Atom centered in the safe zone (center 96,96) -->
  <g transform="translate(96 96)">
    <!-- Outer ring (blue) -->
    <ellipse cx="0" cy="0" rx="66" ry="27" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.9"/>
    <!-- Middle ring (green, rotated 60deg) -->
    <ellipse cx="0" cy="0" rx="66" ry="27" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.9" transform="rotate(60)"/>
    <!-- Inner ring (purple, rotated 120deg) -->
    <ellipse cx="0" cy="0" rx="66" ry="27" fill="none" stroke="#a855f7" stroke-width="4" opacity="0.9" transform="rotate(120)"/>

    <!-- Electrons on each ring -->
    <circle cx="66" cy="0" r="6" fill="#3b82f6"/>
    <circle cx="-33" cy="-28.6" r="6" fill="#22c55e"/>
    <circle cx="-33" cy="28.6" r="6" fill="#a855f7"/>

    <!-- Nucleus glow -->
    <circle cx="0" cy="0" r="30" fill="url(#nucleus-glow)"/>

    <!-- Medical cross in the nucleus -->
    <g fill="#ffffff">
      <rect x="-6" y="-18" width="12" height="36" rx="3"/>
      <rect x="-18" y="-6" width="36" height="12" rx="3"/>
    </g>
  </g>
</svg>
