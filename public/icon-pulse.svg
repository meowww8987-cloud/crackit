<?xml version="1.0" encoding="utf-8"?>
<!-- NEET 2027 Study Tracker — App Icon Option F: Pulse/Heartbeat + Graduation Cap
     A heartbeat/pulse line (ECG style) that morphs into a graduation cap at the end.
     Pulse = teal (#14b8a6), Cap = green (#22c55e).
     Background: dark gradient (#0a0b15 → #1a1f3a).
     Represents: medical + achievement. Dynamic + energetic. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b15"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: dark gradient squircle -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bg-grad)"/>

  <!-- Subtle radial glow behind the design -->
  <circle cx="256" cy="256" r="160" fill="#14b8a6" opacity="0.04"/>

  <!-- === ECG / Heartbeat Pulse Line (teal) === -->
  <!-- Starts flat on the left, has 2 heartbeat spikes, then flows right -->
  <path
    d="M 80,280 L 160,280 L 180,280 L 195,230 L 210,340 L 225,250 L 240,280 L 300,280 L 320,280 L 335,220 L 350,360 L 365,240 L 380,280 L 430,280"
    fill="none"
    stroke="#14b8a6"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Glow layer for the pulse line -->
  <path
    d="M 80,280 L 160,280 L 180,280 L 195,230 L 210,340 L 225,250 L 240,280 L 300,280 L 320,280 L 335,220 L 350,360 L 365,240 L 380,280 L 430,280"
    fill="none"
    stroke="#22c55e"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.15"
    filter="blur(4px)"
  />

  <!-- === Graduation Cap (green) — at the end of the pulse line === -->
  <g transform="translate(430, 280)">
    <!-- Cap board (the flat square top) -->
    <rect x="-35" y="-55" width="70" height="10" rx="2" fill="#22c55e" transform="rotate(0)"/>
    <!-- Cap board perspective lines -->
    <line x1="-35" y1="-50" x2="-30" y2="-45" stroke="#16a34a" stroke-width="2"/>
    <line x1="35" y1="-50" x2="30" y2="-45" stroke="#16a34a" stroke-width="2"/>
    <!-- Cap base (the rounded part under the board) -->
    <path d="M -22,-45 Q -22,-30 0,-28 Q 22,-30 22,-45 Z" fill="#22c55e" opacity="0.8"/>
    <!-- Tassel -->
    <line x1="0" y1="-50" x2="20" y2="-30" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="20" cy="-28" r="4" fill="#fbbf24"/>
    <!-- Tassel string -->
    <line x1="20" y1="-28" x2="20" y2="-10" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Small "NEET" text at bottom -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="bold" fill="#ffffff" opacity="0.2" letter-spacing="6">
    NEET
  </text>
</svg>
