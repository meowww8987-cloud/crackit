<?xml version="1.0" encoding="utf-8"?>
<!-- NEET 2027 Study Tracker — app logo
     Design: stylized atom with 3 orbital rings + nucleus medical cross.
     Color: teal-to-green gradient (signature NEET palette).
     Shape: rounded square (matches PWA icon container).
     The logo reads as "medical science" at a glance — atom (science) +
     cross (medical) — perfect for a NEET prep app. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#14b8a6"/>
      <stop offset="70%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="nucleus-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square with gradient border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0a0b15"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#neet-grad)" stroke-width="2" opacity="0.6"/>

  <!-- Atom: 3 orbital rings at different tilts -->
  <g transform="translate(32 32)">
    <!-- Outer ring (blue) -->
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.85" transform="rotate(0)"/>
    <!-- Middle ring (green) -->
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.85" transform="rotate(60)"/>
    <!-- Inner ring (purple) -->
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.85" transform="rotate(120)"/>

    <!-- Electron dots on each ring -->
    <circle cx="22" cy="0" r="2" fill="#3b82f6"/>
    <circle cx="-11" cy="-9.5" r="2" fill="#22c55e"/>
    <circle cx="-11" cy="9.5" r="2" fill="#a855f7"/>

    <!-- Nucleus glow -->
    <circle cx="0" cy="0" r="10" fill="url(#nucleus-glow)"/>

    <!-- Nucleus = medical cross (subtle, in the center) -->
    <g fill="#ffffff">
      <rect x="-2" y="-6" width="4" height="12" rx="1"/>
      <rect x="-6" y="-2" width="12" height="4" rx="1"/>
    </g>
  </g>
</svg>
